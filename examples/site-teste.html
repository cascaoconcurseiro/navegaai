<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Loja de teste NavegaAI</title><style>body{max-width:620px;margin:60px auto;padding:20px;font-family:Arial,sans-serif}label{display:block;margin:18px 0}input{padding:8px}button{padding:10px 20px}#result{margin-top:20px;background:#def;padding:14px}</style></head><body>
<h1>Página local de testes do NavegaAI</h1><p>Este site é fictício. Sua função é demonstrar navegação, leitura, preenchimento e clique sem compras ou envio externo.</p>
<label>Seu nome <input id="nome" placeholder="Digite seu nome"></label>
<label>Assunto <input id="assunto" placeholder="Digite um assunto"></label>
<button id="botao" type="button">Mostrar confirmação local</button>
<div id="result">Aguardando interação.</div>
<a href="https://example.com">Visitar example.com</a>
<script>document.getElementById('botao').addEventListener('click',()=>{document.getElementById('result').textContent='Confirmação local: '+document.getElementById('nome').value+' / '+document.getElementById('assunto').value;});</script>
</body></html>
